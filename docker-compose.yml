# Full local stack: Postgres, Valkey, Floci (SNS/SQS/S3), Redpanda (Kafka),
# MailHog (SMTP), MockServer (webhook/callback tests), OpenObserve
# (metrics/observability via an OpenTelemetry Collector relay), and the
# payment-service (single process running API, relay, and background jobs).
#
# Usage:
#   docker compose up --build
#
# The payment-service publishes outbox events to Floci's SNS topic
# `payment-events`, which fans out to the `payment-events-consumer` SQS queue
# (both created by the one-shot `floci-init` service). Inspect events with:
#   aws sqs receive-message --queue-url http://localhost:4566/000000000000/payment-events-consumer \
#     --endpoint-url http://localhost:4566
#
# Metrics: the app exports OTLP to `otel-collector` (:4317/:4318), which relays
# to OpenObserve. Open the UI at http://localhost:5080 (root@example.com /
# Complexpass#123) and look under the `default` stream.

services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: payment_dev
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "wal_level=logical"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment_dev"]
      interval: 2s
      timeout: 3s
      retries: 15

  valkey:
    image: valkey/valkey:latest
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  db-migrate:
    image: migrate/migrate:latest
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    entrypoint: ["/bin/sh", "-c"]
    command: ["migrate -path /migrations -database 'postgres://payment:payment@postgres:5432/payment_dev?sslmode=disable' up"]

  db-seed:
    image: postgres:latest
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    volumes:
      - ./seed/seed.sql:/seed.sql
    entrypoint: ["bash", "-c"]
    command: ["psql postgres://payment:payment@postgres:5432/payment_dev -f /seed.sql"]

  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: persistent
    volumes:
      - floci-data:/var/lib/floci

  # One-shot bootstrap: creates the SNS topic + SQS queue + subscription so the
  # payment-service can publish outbox events immediately. Safe to re-run.
  floci-init:
    image: amazon/aws-cli:latest
    depends_on:
      floci:
        condition: service_started
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "floci-init: creating SNS topic payment-events..."
        TOPIC_ARN=$$(aws sns create-topic --name payment-events --query TopicArn --output text)
        echo "floci-init: topic=$${TOPIC_ARN}"
        QUEUE_URL=$$(aws sqs create-queue --queue-name payment-events-consumer --query QueueUrl --output text)
        QUEUE_ARN=$$(aws sqs get-queue-attributes --queue-url $${QUEUE_URL} --attribute-names QueueArn --query Attributes.QueueArn --output text)
        aws sns subscribe --topic-arn $${TOPIC_ARN} --protocol sqs --notification-endpoint $${QUEUE_ARN} >/dev/null
        echo "floci-init: queue=$${QUEUE_URL} subscribed to $${TOPIC_ARN}"

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    ports:
      - "9092:9092" # Kafka client (PLAINTEXT_HOST)
      - "9644:9644" # admin API
      - "8081:8081" # schema registry
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "512M"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,PLAINTEXT_HOST://localhost:9092
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/29092' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI

  mockserver:
    image: mockserver/mockserver:latest
    ports:
      - "1080:1080" # proxy/expectations for webhook & callback tests

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    ports:
      - "5080:5080" # web UI + OTLP/HTTP ingestion
    environment:
      ZO_ROOT_USER_EMAIL: root@example.com
      ZO_ROOT_USER_PASSWORD: Complexpass#123
      ZO_DATA_DIR: /data
      ZO_LOCAL_MODE: "true"
      ZO_TELEMETRY: "false"
    volumes:
      - openobserve-data:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config", "/etc/otelcol-contrib/config.yaml"]
    depends_on:
      openobserve:
        condition: service_started
    environment:
      ZO_ROOT_USER_EMAIL: root@example.com
      ZO_ROOT_USER_PASSWORD: Complexpass#123
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

  # payment-service:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     valkey:
  #       condition: service_healthy
  #     db-seed:
  #       condition: service_completed_successfully
  #     floci-init:
  #       condition: service_completed_successfully
  #   volumes:
  #     - ./config.yaml:/app/config.yaml:ro
  #   environment:
  #     # Only container-specific overrides; everything else comes from config.yaml.
  #     DATABASE_PRIMARY_HOST: postgres
  #     DATABASE_PASSWORD: payment
  #     VALKEY_ADDRS: valkey:6379
  #     SERVICE_TOKENS: test-token=11111111-1111-1111-1111-111111111111:22222222-2222-2222-2222-222222222222
  #     OPS_TOKENS: ops-token
  #     OUTBOX_PUBLISHER: sns
  #     SNS_PAYMENT_EVENTS_TOPIC: arn:aws:sns:us-east-1:000000000000:payment-events
  #     AWS_ENDPOINT_URL: http://floci:4566
  #     AWS_REGION: us-east-1
  #     AWS_ACCESS_KEY_ID: test
  #     AWS_SECRET_ACCESS_KEY: test
  #     SMTP_HOST: mailhog
  #     SMTP_PORT: "1025"
  #     SMTP_FROM: payments@example.com
  #     OBSERVABILITY_BACKEND: otel
  #     OTLP_ENDPOINT: http://otel-collector:4318
  #     OTLP_PROTOCOL: http/protobuf

volumes:
  floci-data:
  openobserve-data:
