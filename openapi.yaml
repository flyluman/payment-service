openapi: 3.0.3
info:
  title: Payment Service API
  description: |
    SaaS multitenant payment processing service with FIB (Fast Iraqi Bank) integration.

    Two authentication models:
    - **Service tokens** (`X-Service-Token`): server-to-server calls — maps to `tenant_id:user_id`.
    - **Checkout tokens** (`token` query param): per-transaction browser tokens returned by Create Payment.

    All responses are wrapped in an envelope: `{ success, data, error, request_id }`.

    All timestamps use RFC3339Nano format.

    Gateway: FIB only (IQD currency, QR code checkout).
  version: 1.1.0
  contact:
    email: dev@example.com

servers:
  - url: http://localhost:8080
    description: Local development

security:
  - serviceToken: []
  - opsToken: []

paths:
  # ── Health ──────────────────────────────────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: DB + Valkey connectivity check
      operationId: healthCheck
      security: []
      responses:
        "200":
          description: All services healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  database:
                    type: string
                    example: ok
                  valkey:
                    type: string
                    example: ok

  # ── Gateway Catalog ───────────────────────────────────────────────────
  /api/v1/gateways:
    get:
      tags: [Gateways]
      summary: List available gateways
      description: Returns gateways that support the given payment methods. FIB is the only gateway currently.
      operationId: listGateways
      security:
        - serviceToken: []
        - opsToken: []
      parameters:
        - name: payment_method
          in: query
          schema:
            type: string
            enum: [card, upi, netbanking, wallet]
          description: Filter by payment method. Defaults to all four.
      responses:
        "200":
          description: Gateway list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListGatewaysResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Tenant Gateway Config ──────────────────────────────────────────
  /api/v1/tenants/{tenant_id}/gateways:
    get:
      tags: [Tenant Gateways]
      summary: List tenant gateway configurations
      operationId: listTenantGateways
      security:
        - serviceToken: []
        - opsToken: []
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: Tenant gateway config list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTenantGatewaysResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Tenant Gateways]
      summary: Create or update a tenant gateway configuration
      operationId: upsertTenantGateway
      security:
        - serviceToken: []
        - opsToken: []
      parameters:
        - $ref: "#/components/parameters/TenantID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertTenantGatewayRequest"
      responses:
        "200":
          description: Config upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpsertTenantGatewayResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/tenants/{tenant_id}/gateways/{gateway_id}:
    get:
      tags: [Tenant Gateways]
      summary: Get a single tenant gateway config
      operationId: getTenantGateway
      security:
        - serviceToken: []
        - opsToken: []
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/GatewayID"
      responses:
        "200":
          description: Gateway config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantGatewayConfigResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Tenant Gateways]
      summary: Delete a tenant gateway config
      operationId: deleteTenantGateway
      security:
        - serviceToken: []
        - opsToken: []
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/GatewayID"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Payments ─────────────────────────────────────────────────────────
  /api/v1/payments:
    post:
      tags: [Payments]
      summary: Create a payment (single-step)
      description: |
        Creates a transaction and returns a per-transaction checkout token in one call.
        The token is used for browser checkout at `/pay/{transaction_id}?token={token}`.

        Requires `Idempotency-Key` header. Returns `201` on new creation, `200` on idempotent replay.
      operationId: createPayment
      security:
        - serviceToken: []
        - opsToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          description: Unique idempotency key per payment creation request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "201":
          description: Payment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePaymentResponse"
        "200":
          description: Idempotent replay of a previous successful request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePaymentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Idempotency conflict (key reused with different body or in-progress)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      tags: [Payments]
      summary: List payments with filters
      description: |
        Paginated list of transactions. Service tokens are scoped to their own tenant (tenant isolation).

        Supports `Accept: text/csv` header for CSV download.
        Cursor-based pagination: use `next_cursor` from response for next page.
      operationId: listPayments
      security:
        - serviceToken: []
        - opsToken: []
      parameters:
        - name: tenant_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by tenant (service tokens auto-scoped to own tenant).
        - name: user_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by user.
        - name: status
          in: query
          schema:
            type: string
          description: Comma-separated statuses (e.g. `PENDING,SUCCEEDED`).
          example: PENDING,SUCCEEDED
        - name: gateway_id
          in: query
          schema:
            type: string
          description: Comma-separated gateway IDs (e.g. `fib`).
        - name: min_amount
          in: query
          schema:
            type: integer
            format: int64
          description: Minimum amount (inclusive).
        - name: max_amount
          in: query
          schema:
            type: integer
            format: int64
          description: Maximum amount (inclusive).
        - name: currency
          in: query
          schema:
            type: string
            minLength: 3
            maxLength: 3
          description: Filter by currency code.
        - name: payment_method
          in: query
          schema:
            type: string
          description: Comma-separated payment methods.
        - name: date_from
          in: query
          schema:
            type: string
            format: date-time
          description: Created-at lower bound (RFC3339).
        - name: date_to
          in: query
          schema:
            type: string
            format: date-time
          description: Created-at upper bound (RFC3339).
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque cursor from previous page response.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Page size (1-100).
      responses:
        "200":
          description: Payment list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPaymentsResponse"
            text/csv:
              schema:
                type: string
                description: CSV download (Accept: text/csv)
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/payments/{id}:
    get:
      tags: [Payments]
      summary: Get payment status and details
      description: |
        API callers use `X-Service-Token`. Browser callers pass `token` as query param.
        Returns full transaction details including `gateway_metadata` (gateway-specific output).
      operationId: getPayment
      security:
        - serviceToken: []
        - token: []
      parameters:
        - $ref: "#/components/parameters/TransactionID"
        - name: token
          in: query
          schema:
            type: string
          description: Required for browser callers (no X-Service-Token header).
      responses:
        "200":
          description: Transaction details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/payments/{id}/events:
    get:
      tags: [Payments]
      summary: SSE stream for real-time payment status updates
      description: |
        Server-Sent Events stream. Events:
        - `connected`: initial handshake `{}`.
        - `status`: payment status change `{ "status": "SUCCEEDED" }`.
        - `: heartbeat`: keep-alive every 30 seconds.

        Auth: service token or token (query param `token`).
      operationId: subscribePaymentEvents
      security:
        - serviceToken: []
        - token: []
      parameters:
        - $ref: "#/components/parameters/TransactionID"
        - name: token
          in: query
          schema:
            type: string
          description: Checkout token for browser callers.
      responses:
        "200":
          description: SSE stream (text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/payments/{id}/refunds:
    post:
      tags: [Payments]
      summary: Initiate a refund
      description: |
        Refund a payment (full or partial). FIB does not support partial refunds, so full amount is always refunded.
        Requires `Idempotency-Key` header. Tenant isolation: verifies transaction belongs to caller's tenant.
      operationId: initiateRefund
      security:
        - serviceToken: []
        - opsToken: []
      parameters:
        - $ref: "#/components/parameters/TransactionID"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundRequest"
      responses:
        "201":
          description: Refund initiated and processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundResponse"
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: Not refundable or over-refund
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/payments/{id}/cancel:
    post:
      tags: [Payments]
      summary: Cancel a pending transaction
      description: |
        Cancel a PENDING transaction. Requires `Idempotency-Key` header.
        Only transactions in PENDING state can be cancelled.
      operationId: cancelPayment
      security:
        - serviceToken: []
        - opsToken: []
      parameters:
        - $ref: "#/components/parameters/TransactionID"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Cancellation completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  # ── Disputes ─────────────────────────────────────────────────────────
  /api/v1/disputes:
    get:
      tags: [Disputes]
      summary: List disputes
      description: Filter by status, gateway, and date range. Sorted by created_at DESC.
      operationId: listDisputes
      security:
        - serviceToken: []
        - opsToken: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [NEEDS_RESPONSE, UNDER_REVIEW, WON, LOST, ACCEPTED, EXPIRED]
        - name: gateway_id
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
          description: Lower bound (RFC3339).
        - name: to
          in: query
          schema:
            type: string
            format: date-time
          description: Upper bound (RFC3339).
      responses:
        "200":
          description: Dispute list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDisputesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/disputes/{id}:
    get:
      tags: [Disputes]
      summary: Get dispute details
      operationId: getDispute
      security:
        - serviceToken: []
        - opsToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Dispute details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisputeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/disputes/{id}/evidence:
    post:
      tags: [Disputes]
      summary: Submit evidence for a dispute
      operationId: submitDisputeEvidence
      security:
        - serviceToken: []
        - opsToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitEvidenceRequest"
      responses:
        "201":
          description: Evidence submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [Disputes]
      summary: List evidence for a dispute
      operationId: listDisputeEvidence
      security:
        - serviceToken: []
        - opsToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Evidence list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEvidenceResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Dead Letters ─────────────────────────────────────────────────────
  /api/v1/dead-letters:
    get:
      tags: [Dead Letters]
      summary: List failed outbox events
      description: Filter by resolved/unresolved, event type, date range.
      operationId: listDeadLetters
      security:
        - serviceToken: []
        - opsToken: []
      parameters:
        - name: resolved
          in: query
          schema:
            type: boolean
          description: Filter by resolved status.
        - name: event_type
          in: query
          schema:
            type: string
          description: Filter by event type.
        - name: date_from
          in: query
          schema:
            type: string
            format: date-time
        - name: date_to
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Dead letter list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDeadLettersResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/dead-letters/{id}/replay:
    post:
      tags: [Dead Letters]
      summary: Replay a failed dead letter event
      operationId: replayDeadLetter
      security:
        - serviceToken: []
        - opsToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Optional reason for replay.
      responses:
        "200":
          description: Event replayed, new event ID returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      new_event_id:
                        type: string
                        format: uuid
                  request_id:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ── Webhooks ──────────────────────────────────────────────────────────
  /webhooks/gateway/{gateway_id}:
    post:
      tags: [Webhooks]
      summary: Inbound gateway webhook
      description: |
        Receives status callbacks from payment gateways.
        Tenant resolution via `?transaction_id=` query param.
        Authentication via gateway-specific signature verification (not service token).
        For FIB: no signature verification (body contains paymentId + status).
      operationId: handleWebhook
      security: []
      parameters:
        - $ref: "#/components/parameters/GatewayID"
        - name: transaction_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Gateway-specific webhook payload.
              example:
                id: fib_pay_1
                paymentId: fib_pay_1
                status: PAID
      responses:
        "200":
          description: Webhook processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResponse"

  # ── Browser Checkout Pages ──────────────────────────────────────────
  /pay/{transaction_id}:
    get:
      tags: [Browser Checkout]
      summary: Hosted checkout page
      description: |
        Renders FIB-specific checkout page with QR code, app links, and countdown timer.
        Requires `token` query param (checkout token) for authentication.
        The page auto-polls `GET /api/v1/payments/{id}` and connects to SSE `GET /api/v1/payments/{id}/events` for real-time updates.
      security: []
      parameters:
        - $ref: "#/components/parameters/TransactionID"
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Per-transaction checkout token.
      responses:
        "200":
          description: Checkout HTML page
          content:
            text/html:
              schema:
                type: string
        "401":
          description: Invalid or missing token

  /pay/success:
    get:
      tags: [Browser Checkout]
      summary: Payment success landing page
      description: |
        Shows success message and auto-redirects to `redirect_url` after 3 seconds.
        Requires checkout token for authentication.
      security: []
      parameters:
        - $ref: "#/components/parameters/TransactionID"
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success HTML page

  /pay/failure:
    get:
      tags: [Browser Checkout]
      summary: Payment failure landing page
      description: |
        Shows failure message with gateway error reason and auto-redirects to `redirect_url` after 3 seconds.
        Requires checkout token for authentication.
      security: []
      parameters:
        - $ref: "#/components/parameters/TransactionID"
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Failure HTML page

components:
  # ── Security Schemes ──────────────────────────────────────────────────
  securitySchemes:
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
      description: |
        Service token mapped to `tenant_id:user_id`. Format: `SERVICE_TOKENS=token=tenantID:userID,...` in env.
        Required for API calls to create payments, list payments, etc.
    opsToken:
      type: apiKey
      in: header
      name: X-Ops-Token
      description: |
        Operational token for admin actions (refunds, cancellations, disputes, dead letters).
        Format: `OPS_TOKENS=token1,token2,...` in env.
    token:
      type: apiKey
      in: query
      name: token
      description: |
        Per-transaction checkout token returned by `POST /api/v1/payments`.
        Used by browser pages for authentication at `/pay/{transaction_id}`.
        Single-use, expires after transaction finalizes.

  # ── Parameters ────────────────────────────────────────────────────────
  parameters:
    TenantID:
      name: tenant_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GatewayID:
      name: gateway_id
      in: path
      required: true
      schema:
        type: string
    TransactionID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Transaction UUID.

  # ── Schemas ───────────────────────────────────────────────────────────
  schemas:
    # ── Envelope ──────────────────────────────────────────────────────
    Envelope:
      type: object
      properties:
        success:
          type: boolean
        data:
          description: Response payload (varies by endpoint).
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
        request_id:
          type: string
      required: [success]

    # ── Gateway ───────────────────────────────────────────────────────
    Gateway:
      type: object
      properties:
        gateway_id:
          type: string
          example: fib
        display_name:
          type: string
          example: "FIB (Fast Iraqi Bank)"
        supported_methods:
          type: array
          items:
            type: string
          example: [card]
        supported_currencies:
          type: array
          items:
            type: string
          example: [IQD]

    ListGatewaysResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Gateway"

    # ── Tenant Gateway ────────────────────────────────────────────────
    TenantGatewayConfig:
      type: object
      properties:
        gateway_id:
          type: string
          example: fib
        provider:
          type: string
          example: fib
        is_active:
          type: boolean
          example: true

    ListTenantGatewaysResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/TenantGatewayConfig"

    TenantGatewayConfigResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TenantGatewayConfig"

    UpsertTenantGatewayRequest:
      type: object
      required: [gateway_id, provider, config]
      properties:
        gateway_id:
          type: string
          example: fib
        provider:
          type: string
          enum: [stripe, razorpay, fib]
          example: fib
        config:
          type: object
          description: Provider-specific config. For FIB: `{ client_id, client_secret, base_url, callback_url }`.
          example:
            client_id: "fib-client-id"
            client_secret: "fib-client-secret"
            base_url: "https://fib-sandbox.example.com"
            callback_url: "http://localhost:8080/webhooks/gateway/fib"
        is_active:
          type: boolean
          default: true

    UpsertTenantGatewayResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                gateway_id:
                  type: string
                provider:
                  type: string
                is_active:
                  type: boolean

    # ── Payment ───────────────────────────────────────────────────────
    CreatePaymentRequest:
      type: object
      required: [gateway_id, amount, currency, payment_method, callback_url, redirect_url]
      properties:
        gateway_id:
          type: string
          description: Gateway to use (e.g. `fib`).
          example: fib
        amount:
          type: integer
          format: int64
          description: Amount in smallest currency unit (e.g. IQD).
          minimum: 1
          example: 50000
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 currency code (uppercase).
          example: IQD
        payment_method:
          type: string
          enum: [card, upi, netbanking, wallet]
          example: card
        customer_id:
          type: string
          format: uuid
          description: Optional external customer identifier.
        customer_email:
          type: string
          format: email
          description: Optional customer email for notifications.
        description:
          type: string
          description: Optional payment description (shown on FIB checkout).
          example: "Order #12345"
        metadata:
          type: object
          additionalProperties: true
          description: Optional key-value metadata (max 4KB).
          example:
            order_id: "12345"
            product: "Premium Plan"
        callback_url:
          type: string
          format: uri
          description: Server-side callback URL. Gateway sends status updates here.
          example: "http://myapp.com/api/webhooks/payment"
        redirect_url:
          type: string
          format: uri
          description: User-facing redirect URL after payment completion.
          example: "https://myapp.com/order/12345/complete"

    CreatePaymentResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                transaction_id:
                  type: string
                  format: uuid
                  description: Unique transaction identifier.
                token:
                  type: string
                  description: Per-transaction checkout token. Use in `/pay/{transaction_id}?token={token}`.
                status:
                  type: string
                  enum: [PENDING]
                  description: Always PENDING on creation.

    PaymentResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                transaction_id:
                  type: string
                  format: uuid
                status:
                  type: string
                  enum: [PENDING, PROCESSING, SUCCEEDED, FAILED, CANCELLED, REFUNDED, REFUND_FAILED]
                amount:
                  type: integer
                  format: int64
                currency:
                  type: string
                  example: IQD
                payment_method:
                  type: string
                  enum: [card, upi, netbanking, wallet]
                gateway_reference_id:
                  type: string
                  description: Gateway-assigned payment ID (e.g. `fib_pay_1`).
                customer_id:
                  type: string
                  format: uuid
                  description: External customer ID (if provided at creation).
                customer_email:
                  type: string
                  format: email
                  description: Customer email (if provided at creation).
                description:
                  type: string
                  description: Payment description (if provided at creation).
                metadata:
                  type: object
                  additionalProperties: true
                  description: Customer-provided metadata.
                gateway_metadata:
                  type: object
                  additionalProperties: true
                  description: |
                    Gateway-specific output. For FIB: `{ qr_code, readable_code, personal_app_link, business_app_link, corporate_app_link, valid_until }`.
                    For Stripe: `{ client_secret, publishable_key }`.
                created_at:
                  type: string
                  format: date-time
                  description: RFC3339Nano timestamp.

    ListPaymentsResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                type: object
                properties:
                  transaction_id:
                    type: string
                    format: uuid
                  user_id:
                    type: string
                    format: uuid
                  amount:
                    type: integer
                    format: int64
                  currency:
                    type: string
                  status:
                    type: string
                  gateway_id:
                    type: string
                  payment_method:
                    type: string
                  created_at:
                    type: string
                    format: date-time
            has_more:
              type: boolean
              description: Whether more pages exist.
            next_cursor:
              type: string
              description: Opaque cursor for next page. Null if no more pages.

    # ── Refund ────────────────────────────────────────────────────────
    RefundRequest:
      type: object
      required: [amount, reason]
      properties:
        amount:
          type: integer
          format: int64
          description: Refund amount in smallest currency unit. FIB only supports full refunds.
          minimum: 1
          example: 50000
        reason:
          type: string
          description: Required reason for the refund.
          example: "Customer request - duplicate charge"

    RefundResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                transaction_id:
                  type: string
                  format: uuid
                status:
                  type: string
                  enum: [REFUND_INITIATED, REFUND_PROCESSING, REFUNDED, REFUND_FAILED]
                amount:
                  type: integer
                  format: int64
                gateway_refund_id:
                  type: string
                  nullable: true
                  description: Gateway-assigned refund ID (populated after processing).

    # ── Cancel ────────────────────────────────────────────────────────
    CancelResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                transaction_id:
                  type: string
                  format: uuid
                status:
                  type: string
                  enum: [CANCELLED]

    # ── Webhook ───────────────────────────────────────────────────────
    WebhookResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                duplicate:
                  type: boolean
                  description: Whether this webhook event was a duplicate.
                resolved:
                  type: boolean
                  description: Whether the payment status was updated.
                unknown_txn:
                  type: boolean
                  description: Whether the transaction was not found.

    # ── Dispute ───────────────────────────────────────────────────────
    Dispute:
      type: object
      properties:
        id:
          type: string
          format: uuid
        transaction_id:
          type: string
          format: uuid
        gateway_id:
          type: string
        reason:
          type: string
        status:
          type: string
          enum: [NEEDS_RESPONSE, UNDER_REVIEW, WON, LOST, ACCEPTED, EXPIRED]
        amount:
          type: integer
          format: int64
        currency:
          type: string
        evidence_due_by:
          type: string
          format: date-time
          nullable: true
        evidence_submitted_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        is_urgent:
          type: boolean
          description: True if evidence due within 7 days.
        days_until_due:
          type: integer
          nullable: true
          description: Days until evidence deadline (null if no deadline).

    ListDisputesResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Dispute"

    DisputeResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Dispute"

    Evidence:
      type: object
      properties:
        id:
          type: string
          format: uuid
        dispute_id:
          type: string
          format: uuid
        evidence_type:
          type: string
          enum: [RECEIPT, INVOICE, CUSTOMER_COMMS, TERMS_OF_SERVICE, REFUND_POLICY, CANCELLATION_POLICY, OTHER]
        file_url:
          type: string
          format: uri
        notes:
          type: string
        submitted_at:
          type: string
          format: date-time

    SubmitEvidenceRequest:
      type: object
      required: [evidence_type, file_url]
      properties:
        evidence_type:
          type: string
          enum: [RECEIPT, INVOICE, CUSTOMER_COMMS, TERMS_OF_SERVICE, REFUND_POLICY, CANCELLATION_POLICY, OTHER]
        file_url:
          type: string
          format: uri
          description: URL to the uploaded evidence file.
        notes:
          type: string
          description: Optional notes about the evidence.

    EvidenceResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Evidence"

    ListEvidenceResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Evidence"

    # ── Dead Letter ───────────────────────────────────────────────────
    DeadLetter:
      type: object
      properties:
        id:
          type: string
          format: uuid
        aggregate_id:
          type: string
          format: uuid
        event_type:
          type: string
        error_message:
          type: string
        attempts:
          type: integer
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        resolved_by:
          type: string
          nullable: true

    ListDeadLettersResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/DeadLetter"

    # ── Error ─────────────────────────────────────────────────────────
    ErrorResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            success:
              example: false
            error:
              $ref: "#/components/schemas/ErrorBody"

    ErrorBody:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable error code.
          example: missing_gateway_id
        message:
          type: string
          description: Human-readable error message.
          example: gateway_id is required

  # ── Reusable Responses ────────────────────────────────────────────────
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Insufficient permissions or tenant mismatch
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Idempotency conflict or state conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
